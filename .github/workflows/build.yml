name: Build Web App to IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build Web Project
        run: bun run build

      - name: Configure Capacitor & Add iOS
        run: |
          WEB_DIR="dist"
          if [ -d "out" ]; then WEB_DIR="out"; fi
          if [ -d "build" ]; then WEB_DIR="build"; fi
          mkdir -p $WEB_DIR

          bun add @capacitor/core @capacitor/cli @capacitor/ios

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.mystore.app",
            "appName": "MyStore",
            "webDir": "$WEB_DIR",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild build -scheme App -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: '*.ipa'
