name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor / Cordova iOS
        run: |
          npx cap add ios || true
          npx cap copy ios || true

      - name: Build iOS Archive & IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/IPA -exportOptionsPlist App/ExportOptions.plist CODE_SIGNING_ALLOWED=NO || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: App-IPA
          path: ios/App/build/
